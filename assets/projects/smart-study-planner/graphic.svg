<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="ssBg" x1="0" x2="1"><stop offset="0%" stop-color="#051223"/><stop offset="100%" stop-color="#071426"/></linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#ssBg)"/>

  <!-- calendar grid -->
  <g transform="translate(80,60)">
    <rect x="0" y="0" width="360" height="300" rx="12" fill="rgba(255,255,255,0.02)"/>
    <!-- week rows -->
    <g fill-opacity="0.04">
      <rect x="16" y="18" width="80" height="64" rx="8" fill="#0b1b26"/>
      <rect x="104" y="18" width="80" height="64" rx="8" fill="#081826"/>
      <rect x="192" y="18" width="80" height="64" rx="8" fill="#0b1b26"/>
      <rect x="280" y="18" width="48" height="64" rx="8" fill="#081826"/>
    </g>
  </g>

  <!-- task/checklist cards center -->
  <g transform="translate(480,90)">
    <rect x="0" y="0" width="360" height="220" rx="12" fill="rgba(255,255,255,0.015)"/>
    <rect x="16" y="16" width="128" height="28" rx="6" fill="#3cd7ff" opacity="0.12"/>
    <g transform="translate(20,56)" fill="#bcdcff">
      <rect x="0" y="0" width="280" height="20" rx="6"/>
      <rect x="0" y="36" width="220" height="20" rx="6"/>
      <rect x="0" y="72" width="180" height="20" rx="6"/>
    </g>
    <circle cx="312" cy="164" r="18" fill="#64e3ff"/>
  </g>

  <!-- progress streak (right) -->
  <g transform="translate(920,120)">
    <rect x="0" y="0" width="180" height="170" rx="12" fill="rgba(255,255,255,0.015)"/>
    <rect x="20" y="18" width="140" height="22" rx="6" fill="#edb1ff" opacity="0.08"/>
    <rect x="20" y="54" width="140" height="18" rx="6" fill="#3cd7ff" opacity="0.06"/>
    <circle cx="90" cy="120" r="34" fill="#0b1720" stroke="#3cd7ff" stroke-width="2"/>
  </g>

</svg>
