<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#0f1a27"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="thinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="accentCyan" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3cd7ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3cd7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentViolet" cx="70%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#edb1ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#edb1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg)" />

  <!-- Ambient glows -->
  <ellipse cx="300" cy="140" rx="260" ry="120" fill="url(#accentCyan)" filter="url(#softGlow)" />
  <ellipse cx="920" cy="420" rx="300" ry="140" fill="url(#accentViolet)" filter="url(#softGlow)" />

  <!-- central glass panel group -->
  <g transform="translate(180,120)">
    <!-- large translucent dashboard plate -->
    <rect x="120" y="20" width="760" height="360" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)"/>
    <g filter="url(#thinShadow)">
      <!-- left column cards -->
      <rect x="156" y="56" width="140" height="96" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(60,215,255,0.06)"/>
      <rect x="316" y="56" width="160" height="96" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(237,177,255,0.04)"/>
      <!-- center grid area -->
      <rect x="156" y="168" width="640" height="180" rx="12" fill="rgba(11,17,28,0.6)" stroke="rgba(255,255,255,0.02)"/>
    </g>

    <!-- analytics line (minimal) -->
    <polyline points="184,286 240,250 320,264 410,220 520,238 640,208" fill="none" stroke="#64e3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <circle cx="240" cy="250" r="4" fill="#a8e8ff"/>
    <circle cx="410" cy="220" r="4" fill="#a8e8ff"/>

    <!-- small floating UI cards -->
    <g opacity="0.95">
      <rect x="860" y="36" width="84" height="56" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(60,215,255,0.06)"/>
      <rect x="860" y="106" width="100" height="64" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(237,177,255,0.04)"/>
      <rect x="88" y="260" width="110" height="60" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.03)"/>
    </g>

    <!-- creator avatar nodes (abstract circles) -->
    <g>
      <circle cx="200" cy="120" r="14" fill="#a8e8ff" opacity="0.95"/>
      <circle cx="260" cy="180" r="12" fill="#edb1ff" opacity="0.95"/>
      <circle cx="340" cy="140" r="10" fill="#3cd7ff" opacity="0.95"/>
      <!-- minimal connection lines / nodes -->
      <line x1="214" y1="120" x2="292" y2="155" stroke="rgba(168,232,255,0.12)" stroke-width="2" stroke-linecap="round"/>
      <line x1="296" y1="155" x2="344" y2="140" stroke="rgba(237,177,255,0.08)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- sponsorship edges with tiny nodes -->
    <g>
      <circle cx="580" cy="98" r="5" fill="#a8e8ff" opacity="0.9"/>
      <circle cx="700" cy="120" r="5" fill="#edb1ff" opacity="0.9"/>
      <line x1="584" y1="98" x2="696" y2="120" stroke="rgba(168,232,255,0.08)" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- subtle grid lines behind center plate -->
    <g opacity="0.04" stroke="white">
      <line x1="176" y1="176" x2="776" y2="176" stroke-width="1"/>
      <line x1="176" y1="206" x2="776" y2="206" stroke-width="1"/>
      <line x1="176" y1="236" x2="776" y2="236" stroke-width="1"/>
    </g>

    <!-- soft highlights on plate corners -->
    <rect x="120" y="20" width="760" height="360" rx="18" fill="none" stroke="rgba(60,215,255,0.02)"/>
  </g>

  <!-- extra floating depth element (very subtle) -->
  <g transform="translate(760,60) rotate(-6)">
    <rect x="0" y="0" width="220" height="120" rx="14" fill="rgba(255,255,255,0.01)" stroke="rgba(237,177,255,0.02)" filter="url(#softGlow)"/>
  </g>

</svg>
