<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1">
      <stop offset="0%" stop-color="#071225"/>
      <stop offset="100%" stop-color="#0b1620"/>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#3cd7ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3cd7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="78%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#edb1ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#edb1ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blursoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bg2)" opacity="0.98"/>
  <ellipse cx="220" cy="340" rx="260" ry="120" fill="url(#glowA)" filter="url(#blursoft)" />
  <ellipse cx="900" cy="110" rx="260" ry="100" fill="url(#glowB)" filter="url(#blursoft)" />

  <!-- main layout group centered upper area -->
  <g transform="translate(140,48)">
    <!-- house panel (background plate) -->
    <rect x="0" y="0" width="920" height="320" rx="18" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.03)"/>

    <!-- smartphone mock (left) -->
    <g>
      <rect x="36" y="34" width="132" height="236" rx="20" fill="rgba(10,12,18,0.85)" stroke="rgba(60,215,255,0.06)"/>
      <rect x="56" y="60" width="92" height="160" rx="10" fill="rgba(255,255,255,0.01)"/>
      <!-- small UI dots -->
      <circle cx="96" cy="100" r="4" fill="#3cd7ff"/>
      <rect x="70" y="140" width="52" height="18" rx="6" fill="#edb1ff" opacity="0.06"/>
    </g>

    <!-- device cards (center) -->
    <g>
      <rect x="196" y="34" width="150" height="84" rx="10" fill="rgba(255,255,255,0.015)" stroke="rgba(60,215,255,0.05)"/>
      <rect x="358" y="34" width="190" height="84" rx="10" fill="rgba(255,255,255,0.015)" stroke="rgba(237,177,255,0.04)"/>
      <rect x="196" y="132" width="520" height="156" rx="12" fill="rgba(8,12,18,0.6)" stroke="rgba(255,255,255,0.02)"/>
    </g>

    <!-- connection nodes -->
    <g>
      <circle cx="280" cy="94" r="6" fill="#a8e8ff" />
      <circle cx="420" cy="160" r="6" fill="#edb1ff" />
      <circle cx="560" cy="124" r="6" fill="#3cd7ff" />
      <line x1="286" y1="94" x2="414" y2="156" stroke="rgba(168,232,255,0.12)" stroke-width="2" stroke-linecap="round"/>
      <line x1="426" y1="156" x2="556" y2="124" stroke="rgba(237,177,255,0.08)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- energy bolt motif -->
    <g transform="translate(740,48)">
      <path d="M28 12 L10 60 L36 60 L14 108 L86 36 L60 36 L82 12 Z" fill="#edb1ff" opacity="0.08"/>
    </g>

    <!-- energy graph (right) -->
    <polyline points="720,230 760,200 800,220 860,180 920,200" fill="none" stroke="#64e3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <circle cx="760" cy="200" r="3.8" fill="#a8e8ff"/>

    <!-- smart device icons (minimal) -->
    <g>
      <rect x="520" y="46" width="72" height="48" rx="8" fill="rgba(255,255,255,0.015)" stroke="rgba(60,215,255,0.05)"/>
      <rect x="608" y="46" width="72" height="48" rx="8" fill="rgba(255,255,255,0.015)" stroke="rgba(237,177,255,0.04)"/>
      <circle cx="548" cy="70" r="6" fill="#3cd7ff"/>
      <circle cx="636" cy="70" r="6" fill="#edb1ff"/>
    </g>
  </g>

</svg>
