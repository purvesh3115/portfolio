    <g fill="#071827" opacity="0.85">
      <rect x="40" y="20" width="48" height="120" rx="4"/>
      <rect x="108" y="48" width="72" height="92" rx="4"/>
      <rect x="196" y="0" width="112" height="140" rx="4"/>
